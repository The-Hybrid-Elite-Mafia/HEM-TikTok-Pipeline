name: HEM TikTok Pipeline

on:
  schedule:
    # GitHub cron is always UTC. Times below are Chicago time.
    # Until Nov 1 (CDT): 9:07 AM, 2:07 PM, 9:07 PM
    # After Nov 1 (CST): each run lands one hour earlier (8:07 AM, 1:07 PM, 8:07 PM)
    - cron: "7 14 * * *"   # Morning
    - cron: "7 19 * * *"   # Afternoon
    - cron: "7 2 * * *"    # Night
  workflow_dispatch:       # adds a "Run workflow" button for manual test runs

permissions:
  contents: write          # lets the job commit history.json back to the repo

concurrency:
  group: hem-tiktok-pipeline
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg and bold font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Generate, render, and post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          TIKTOK_POST_MODE: ${{ vars.TIKTOK_POST_MODE }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
          TEXT_BOX_CENTER_X: ${{ vars.TEXT_BOX_CENTER_X }}
          TEXT_BOX_CENTER_Y: ${{ vars.TEXT_BOX_CENTER_Y }}
          TEXT_BOX_WIDTH: ${{ vars.TEXT_BOX_WIDTH }}
          TEXT_BOX_HEIGHT: ${{ vars.TEXT_BOX_HEIGHT }}
          TEXT_MAX_FONT: ${{ vars.TEXT_MAX_FONT }}
          TEXT_STYLE: ${{ vars.TEXT_STYLE }}
          TEXT_COVER: ${{ vars.TEXT_COVER }}
        run: python main.py

      - name: Save rendered video as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hem-post-${{ github.run_number }}
          path: |
            output.mp4
            build/post.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit quote history
        if: always()
        run: |
          git config user.name "hem-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -m "HEM: log quote $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
