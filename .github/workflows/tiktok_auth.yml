name: TikTok Auth (one-time)

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Leave EMPTY on the first run. Second run: paste the full address TikTok sent you to."
        required: false
        default: ""

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hide the code from logs
        if: ${{ inputs.code != '' }}
        env:
          AUTH_CODE: ${{ inputs.code }}
        run: echo "::add-mask::$AUTH_CODE"

      - run: pip install requests

      - name: Get login link / save refresh token
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REDIRECT_URI: ${{ vars.TIKTOK_REDIRECT_URI }}
          AUTH_CODE: ${{ inputs.code }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python tiktok_auth.py
